<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 🎉</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(120deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* Floating balloons */
.balloon {
  position: absolute;
  width: 60px;
  height: 80px;
  border-radius: 50%;
  animation: float 6s infinite ease-in-out;
}

.balloon::after {
  content: '';
  position: absolute;
  width: 2px;
  height: 40px;
  background: #555;
  left: 50%;
  top: 80px;
}

@keyframes float {
  0% { transform: translateY(100vh); }
  100% { transform: translateY(-200px); }
}

.card {
  background: #fff;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  max-width: 350px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.2);
  animation: pop 1s ease;
}

@keyframes pop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}

h1 {
  margin: 0;
  color: #ff4081;
}

p {
  color: #444;
  margin: 15px 0;
}

img {
  width: 100%;
  border-radius: 15px;
  margin-top: 15px;
  animation: zoom 3s infinite alternate;
}

@keyframes zoom {
  from { transform: scale(1); }
  to { transform: scale(1.05); }
}
</style>
</head>

<body>

<!-- Balloons -->
<div class="balloon" style="left:10%; background:red;"></div>
<div class="balloon" style="left:30%; background:yellow; animation-delay:1s;"></div>
<div class="balloon" style="left:50%; background:blue; animation-delay:2s;"></div>
<div class="balloon" style="left:70%; background:purple; animation-delay:3s;"></div>
<div class="balloon" style="left:90%; background:orange; animation-delay:4s;"></div>

<!-- Birthday Card -->
<div class="card">
  <h1>🎉 Happy Birthday 🎂</h1>
  <p>May your day be filled with love, joy & success 💖</p>

  <!-- CHANGE PHOTO NAME HERE -->
  <img src="photo1.jpg" alt="Birthday Memory">
</div>

</body>
</html>
