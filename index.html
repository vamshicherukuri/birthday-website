<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 🎉</title>

<style>
  body {
    <h1 style="color:red;">FORCE UPDATE TEST</h1>
    margin: 0;
    height: 100vh;
    background: linear-gradient(120deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    animation: fadeIn 2s ease;
  }

  h1 {
    font-size: 48px;
    animation: bounce 2s infinite;
  }

  p {
    font-size: 22px;
    margin-top: 10px;
    animation: slideUp 2s ease;
  }

  img {
    width: 220px;
    border-radius: 15px;
    margin-top: 20px;
    animation: zoomIn 2s ease;
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes zoomIn {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  /* Floating balloons */
  .balloon {
    position: absolute;
    bottom: -100px;
    width: 40px;
    height: 60px;
    background: red;
    border-radius: 50%;
    animation: float 8s infinite;
  }

  .balloon:nth-child(1) { left: 10%; background: #ff4d4d; animation-delay: 0s; }
  .balloon:nth-child(2) { left: 30%; background: #ffd700; animation-delay: 2s; }
  .balloon:nth-child(3) { left: 50%; background: #4da6ff; animation-delay: 4s; }
  .balloon:nth-child(4) { left: 70%; background: #ff66cc; animation-delay: 1s; }
  .balloon:nth-child(5) { left: 90%; background: #66ff66; animation-delay: 3s; }

  @keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-110vh); }
  }
</style>
</head>

<body>

<div class="card">
  <h1>TEST UPDATE</h1>
  <p>May your day be filled with love, joy & success 💖</p>
  <img src="https://images.unsplash.com/photo-1527529482837-4698179dc6ce" alt="Birthday">
</div>

<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>

</body>
</html>
