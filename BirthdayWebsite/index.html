<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    color: #fff;
    text-align: center;
    overflow-x: hidden;
  }

  h1 {
    font-size: 50px;
    margin-top: 30px;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  #moments {
    margin: 20px auto;
    max-width: 600px;
    font-size: 22px;
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 15px;
  }

  #gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    margin: 20px auto;
  }

  .photo {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.3s;
  }

  .photo:hover {
    transform: scale(1.1);
  }

  button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    background-color: #ff6f91;
    color: white;
    cursor: pointer;
    transition: 0.3s;
    margin: 20px;
  }

  button:hover {
    background-color: #ff3c6e;
  }

  /* Confetti */
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #fff;
    opacity: 0.7;
    z-index: 9999;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>🎉 Happy Birthday! 🎉</h1>

<div id="moments">Wishing you happiness, laughter, and love today and always! 💖</div>

<div id="gallery">
  <img src="photo1.jpg" class="photo" alt="Memory 1">
  <img src="photo2.jpg" class="photo" alt="Memory 2">
  <img src="photo3.jpg" class="photo" alt="Memory 3">
</div>

<button onclick="nextMoment()">Next Moment</button>

<!-- Optional: remove if you don't have music -->
<!--
<audio id="birthdayMusic" loop autoplay>
  <source src="happy-birthday.mp3" type="audio/mpeg">
</audio>
-->

<script>
  // Moments array
  const moments = [
    "Remember our first trip together? 🚗💨",
    "Your smile brightens everyone's day! 😄",
    "Happy memories and laughter, today and always! 🎂",
    "You are amazing, keep shining! ✨"
  ];

  let index = 0;
  function nextMoment() {
    index = (index + 1) % moments.length;
    document.getElementById('moments').innerText = moments[index];
  }

  // Confetti effect
  function createConfetti() {
    const confetti = document.createElement('div');
    confetti.classList.add('confetti');
    confetti.style.left = Math.random() * window.innerWidth + 'px';
    confetti.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
    document.body.appendChild(confetti);

    let top = 0;
    const fall = setInterval(() => {
      top += Math.random() * 5 + 2;
      confetti.style.top = top + 'px';
      if (top > window.innerHeight) {
        confetti.remove();
        clearInterval(fall);
      }
    }, 20);
  }

  setInterval(createConfetti, 100);
</script>

</body>
</html>
